<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>FileBox — передача файлов по коду</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px; }
    h1 { font-size: 1.6rem; }
    form { margin: 24px 0; padding: 20px; border: 1px solid #ddd; border-radius: 12px; }
    input[type=file] { display: block; margin-bottom: 12px; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .code { font-size: 1.8rem; font-weight: 700; letter-spacing: 3px; background: #f1f5f9; padding: 14px 18px; border-radius: 10px; text-align: center; user-select: all; }
    .msg { padding: 10px; background: #fee2e2; border-radius: 8px; color: #991b1b; margin-bottom: 12px; }
    .hint { color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>FileBox</h1>

  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="msg">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}

  {% if new_code %}
    <p>Файл загружен. Передайте этот код получателю устно:</p>
    <div class="code">{{ new_code }}</div>
    <p class="hint">Код действует 24 часа.</p>
    <p><a href="{{ url_for('index') }}">Загрузить ещё файл</a></p>
  {% else %}
    <form method="post" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Загрузить и получить код</button>
    </form>
  {% endif %}

  <form method="post" action="{{ url_for('check_code') }}">
    <label>У меня есть код — введите его:</label><br><br>
    <input type="text" name="code" inputmode="numeric" pattern="\d{16}"
           maxlength="16" placeholder="16 цифр" required
           style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px">
    <br><br>
    <button type="submit">Перейти к файлу</button>
  </form>
</body>
</html>
